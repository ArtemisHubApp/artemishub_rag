[project]
name = "artemishub-rag"
version = "0.1.0"
description = "RAG Pipeline for Career Orientation"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "chromadb>=1.5,<2",
    "httpx>=0.27,<1",
    "pymupdf>=1.24,<2",
    "sentence-transformers>=3,<6",
    "python-dotenv>=1,<2",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8,<10",
    "ruff>=0.6,<1",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
